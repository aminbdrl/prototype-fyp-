{% extends "base.html" %}

{% block content %}

<h1>Admin Login</h1>
<p>Login to access dataset management and system reports.</p>

<div class="table-box">
    <form method="POST" action="/login">
        <input type="text" name="username" placeholder="Username" class="search-input" required>
        <br><br>

        <input type="password" name="password" placeholder="Password" class="search-input" required>
        <br><br>

        <button type="submit" class="btn">Login</button>
    </form>

    {% if error %}
        <p class="red">{{ error }}</p>
    {% endif %}
</div>

{% endblock %}
